<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clearview — Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--navy:#002D72;--navy-dark:#001a52;--charcoal:#393D47;--fg2:#5a6270;--canvas:#eef2f7;--surface:#ffffff;--surface1:#f6f8fb;--sky:#CED9E5;--mist:#D8E5ED;
--b1:rgba(0,45,114,.11);--b2:rgba(0,45,114,.20);--green:#007A53;--green-bg:#e6f3ed;--amber:#9a6200;--amber-bg:#fff8e1;--red:#CE0037;--red-bg:#fce8ee;--grey-bg:#f3f4f5;--blue:#0063C6}
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.5;color:var(--charcoal);background:var(--canvas)}
header{background:var(--navy);color:#fff;padding:10px 24px;display:flex;align-items:center;gap:20px;min-height:64px;box-sizing:border-box;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header .brand{display:flex;align-items:center;gap:12px;flex-shrink:0;white-space:nowrap}
header .mark{width:36px;height:36px;border-radius:8px;background:#fff;color:var(--navy);display:grid;place-items:center;font:800 14px 'Libre Franklin',sans-serif;letter-spacing:-.02em}
header .bt{display:flex;flex-direction:column;line-height:1.1}
header .bt b{font:800 19px 'Libre Franklin',sans-serif;letter-spacing:-.01em}
header .bt small{font:700 11px Barlow,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:3px}
header .hsep{width:1px;align-self:stretch;background:rgba(255,255,255,.2);margin:4px 0}
header .ctx{display:flex;align-items:flex-end;gap:10px;min-width:0}
header .crumb{color:rgba(255,255,255,.45);font-size:20px;padding-bottom:6px}
header .pick{display:flex;flex-direction:column;gap:3px;min-width:0}
header .pick small{font:700 10px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
header select{background:var(--navy-dark);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:5px 28px 5px 10px;font:600 14px Barlow,sans-serif;max-width:240px;min-width:150px;cursor:pointer}
header select:hover{border-color:rgba(255,255,255,.45)}
header select:focus{outline:none;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
header .spacer{flex:1}
header .who{display:flex;align-items:center;gap:10px;flex-shrink:0}
header .who select{min-width:170px}
header .avatar{width:34px;height:34px;border-radius:50%;background:var(--teal,#00A3AD);color:#fff;display:grid;place-items:center;font:700 13px Barlow,sans-serif;flex-shrink:0}
.proto{background:var(--amber-bg);color:var(--amber);font-size:12.5px;padding:6px 24px;border-bottom:1px solid #ffe082;display:flex;align-items:center;gap:10px}.proto .pp{font:700 10px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;border:1px solid currentColor;border-radius:9999px;padding:2px 8px;flex-shrink:0}.proto .pt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:flex;gap:4px;padding:0 24px;background:#fff;border-bottom:1px solid var(--b1)}
nav button{border:0;background:none;padding:14px 16px;font:600 14px Barlow,sans-serif;color:var(--fg2);border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--navy);border-color:var(--navy)}
main{max-width:1100px;margin:0 auto;padding:24px}
h1{font-family:'Libre Franklin',sans-serif;font-weight:800;color:var(--navy);font-size:26px;margin:0 0 4px}
.sub{color:var(--fg2);margin:0 0 20px}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:20px;background:#fff;border:1px solid var(--b1);border-radius:10px;padding:14px 18px}
.bar{flex:1;height:8px;background:var(--grey-bg);border-radius:9999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.card{background:#fff;border:1px solid var(--b1);border-radius:10px;margin-bottom:16px;overflow:hidden}
.card.done{border-left:5px solid var(--green)}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer}
.card-h h3{margin:0;font-family:'Libre Franklin',sans-serif;font-size:17px;color:var(--navy);flex:1}
.lane{font:700 11px 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--fg2)}
.pill{font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:9999px;border:1px solid}
.p-Green{color:var(--green);background:var(--green-bg);border-color:#a8d5c2}
.p-Amber{color:var(--amber);background:var(--amber-bg);border-color:#ffe082}
.p-Red{color:var(--red);background:var(--red-bg);border-color:#f4aac4}
.p-Complete{color:var(--navy);background:var(--mist);border-color:var(--sky)}
.p-NotStarted,.p-OnHold{color:var(--fg2);background:var(--grey-bg);border-color:#d5d6d7}
.saved{font-size:13px;color:var(--green);font-weight:600}
.card-b{padding:4px 20px 20px;border-top:1px solid var(--b1);display:none}
.card.open .card-b{display:block}
.q{margin-top:18px}
.q label{display:block;font:700 13px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--fg2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--b2);background:#fff;border-radius:9999px;padding:8px 16px;font:600 14px Barlow,sans-serif;color:var(--charcoal);cursor:pointer;min-height:40px}
.chip:hover{background:var(--surface1)}
.chip.on.c-Green{background:var(--green);border-color:var(--green);color:#fff}
.chip.on.c-Amber{background:#E3A008;border-color:#E3A008;color:#1d1d1d}
.chip.on.c-Red{background:var(--red);border-color:var(--red);color:#fff}
.chip.on.c-Complete,.chip.on.c-x{background:var(--navy);border-color:var(--navy);color:#fff}
.hint{font-size:13px;color:var(--fg2);margin-top:4px}
textarea,input[type=text],input[type=date]{width:100%;font:inherit;border:1px solid var(--sky);border-radius:6px;padding:10px 12px;background:#fff}
textarea{min-height:70px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,45,114,.10)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.slider{display:flex;align-items:center;gap:12px}
.slider input{flex:1;accent-color:var(--navy)}
.slider b{width:48px;text-align:right;color:var(--navy)}
.ms{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--b1)}
.ms:last-child{border-bottom:0}
.ms .nm{font-weight:600}
.ms .dt{font-size:13px;color:var(--fg2)}
.ms .dt.late{color:var(--red);font-weight:600}
.ms .chips .chip{padding:5px 12px;min-height:32px;font-size:13px}
.ms .newdate{grid-column:1/-1;display:none}
.ms .newdate.show{display:flex;gap:8px;align-items:center;font-size:13px}
.ms .newdate input{width:180px}
.btns{display:flex;gap:12px;margin-top:20px;align-items:center}
.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:11px 22px;font:600 15px Barlow,sans-serif;cursor:pointer}
.btn:hover{background:var(--navy-dark)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--b2)}
.mic{background:none;border:1.5px solid var(--b2);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--navy);font:600 13px Barlow,sans-serif;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
.tile{background:#fff;border:1px solid var(--b1);border-left:4px solid var(--navy);border-radius:10px;padding:14px 16px}
.tile b{display:block;font:800 30px 'Libre Franklin',sans-serif;color:var(--navy);line-height:1.1}
.tile span{font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--fg2)}
.tile.g{border-left-color:var(--green)}.tile.a{border-left-color:#E3A008}.tile.r{border-left-color:var(--red)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--b1);border-radius:10px;overflow:hidden}
th{font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--navy);text-align:left;padding:10px 12px}
td{padding:10px 12px;border-top:1px solid var(--b1);vertical-align:top}
tr.miss td:first-child{border-left:4px solid var(--red)}
.ok{color:var(--green);font-weight:600}.no{color:var(--red);font-weight:600}
.panel{background:#fff;border:1px solid var(--b1);border-radius:10px;padding:18px 20px;margin-bottom:20px}
.panel h2{font:700 18px 'Libre Franklin',sans-serif;color:var(--navy);margin:0 0 10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--charcoal);color:#fff;padding:12px 20px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.sub-form{background:var(--surface1);border:1px solid var(--b1);border-radius:8px;padding:14px;margin-top:12px}
.lbl{font:600 13px Barlow,sans-serif;color:var(--fg2);margin:10px 0 4px}
.li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--b1)}
.p-x{color:var(--navy);background:var(--mist);border-color:var(--sky)}
.rte{border:1px solid var(--sky);border-radius:6px;background:#fff;overflow:hidden}
.rte:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,45,114,.10)}
.tb{display:flex;flex-wrap:wrap;gap:2px;padding:4px;background:var(--surface1);border-bottom:1px solid var(--b1)}
.tb button{border:0;background:none;border-radius:4px;padding:4px 9px;font:14px Barlow,sans-serif;color:var(--charcoal);cursor:pointer;min-width:30px}
.tbsp{flex:1}.dict{white-space:nowrap}.dict.live{background:var(--red)!important;color:#fff!important}
.inmic{display:flex;gap:6px}.inmic input{flex:1}.inmic .dict{border:1px solid var(--sky);background:#fff;border-radius:6px;padding:0 10px;cursor:pointer}
.tb button:hover{background:var(--mist)}
.ed{min-height:84px;padding:10px 12px;outline:none}
.ed:empty:before{content:attr(data-ph);color:#9aa3ae}
.ed ul,.ed ol,.rich ul,.rich ol{margin:4px 0;padding-left:22px}
.rich{font-size:14px}.rich ul{margin:0}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px}.filters .spacer{flex:1}
.filters select,select[data-nws]{font:inherit;border:1px solid var(--sky);border-radius:6px;padding:8px 10px;background:#fff}
table.raid tr.rr{cursor:pointer}table.raid tr.rr:hover td{background:var(--surface1)}table.raid tr.sel td{background:var(--mist)}
.imp{font:700 11px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}.i-Critical,.i-High{color:var(--red)}.i-Medium{color:var(--amber)}.i-Low{color:var(--fg2)}
.t-Risk{color:var(--red);background:var(--red-bg);border-color:#f4aac4}.t-Issue{color:var(--amber);background:var(--amber-bg);border-color:#ffe082}.t-Decision{color:var(--navy);background:var(--mist);border-color:var(--sky)}
pre.email{white-space:pre-wrap;background:var(--surface1);border:1px solid var(--b1);border-radius:6px;padding:14px;font:14px Barlow,sans-serif}
@media (max-width:1100px){header .hsep{display:none}header .ctx{order:3;width:100%;padding-top:10px;border-top:1px solid rgba(255,255,255,.15)}header .ctx .pick{flex:1}header .ctx select{max-width:none;min-width:0;width:100%}header .who select{min-width:0}}
@media (max-width:700px){.row2{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}header{padding:10px 12px;gap:10px 12px}header .who .pick small,header .avatar{display:none}header .who select{max-width:150px}.proto{padding:6px 12px}main{padding:14px}.hide-m{display:none}}

.trace{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;color:var(--fg2);margin-top:2px}
.trace a{color:var(--blue);text-decoration:none;white-space:nowrap}.trace a:hover{text-decoration:underline}
.trace .k{font:700 10.5px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--fg2);margin-right:2px}
.grp{margin:26px 0 10px}.grp h2{font:800 20px 'Libre Franklin',sans-serif;color:var(--navy);margin:0}
.storyh{display:flex;align-items:center;gap:12px;margin:18px 0 8px;padding:10px 14px;background:var(--mist);border-radius:8px}
.storyh b{color:var(--navy)}.storyh .bar{max-width:160px}
.meta{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--fg2)}.meta .late{color:var(--red);font-weight:600}
.scope{display:flex;gap:8px;margin-bottom:12px}
.ro{background:var(--grey-bg);border-radius:6px;padding:8px 12px;font-size:14px}
td .bar{min-width:80px}
.t-Actionitem{color:#5b3a8c;background:#f1ebf8;border-color:#d6c6ec}

.heads{background:#fff;border:1px solid var(--b1);border-left:4px solid #6b4bd1;border-radius:10px;padding:14px 18px;margin-bottom:18px}
.heads.ok{border-left-color:var(--green)}.heads .hh{display:flex;gap:8px;align-items:center}.heads .hh .hint{margin-left:auto}
.spark{color:#6b4bd1;font-size:16px}.heads ul{margin:8px 0 6px;padding-left:20px}.heads li{margin:4px 0}
.sev-red::marker{color:var(--red)}.sev-red{color:#8a1030}.sev-amber::marker{color:#E3A008}.sev-info::marker{color:var(--fg2)}
.ids a{font-size:12.5px;color:var(--blue)}
.seg{display:inline-flex;border:1.5px solid var(--b2);border-radius:8px;overflow:hidden;margin:4px 0 14px}
.seg button{border:0;background:#fff;padding:8px 16px;font:600 14px Barlow,sans-serif;color:var(--fg2);cursor:pointer}.seg button.on{background:var(--navy);color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.toolbar .spacer{flex:1}
.btn.sm{padding:7px 14px;font-size:13.5px}
.row3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:14px}.row3 select,select.full{width:100%;font:inherit;border:1px solid var(--sky);border-radius:6px;padding:9px 10px;background:#fff}
.waits{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.dep{background:var(--mist);border-radius:9999px;padding:4px 6px 4px 12px;font-size:13px}.dep.bad{background:var(--red-bg);color:var(--red)}
.dep button{border:0;background:none;cursor:pointer;font-size:15px;color:inherit}
.pill.sm{font-size:10px;padding:1px 6px}
table.compact tr{cursor:pointer}table.compact tr:hover td{background:var(--surface1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
table.mini{border:0;font-size:13.5px}table.mini th{background:var(--surface1);color:var(--fg2)}
.vel{display:flex;align-items:flex-end;gap:14px;height:160px;padding-top:10px}.vel div{display:flex;flex-direction:column;align-items:center;flex:1}
.vel b{display:block;width:100%;max-width:46px;background:var(--navy);border-radius:4px 4px 0 0;position:relative}.vel b span{position:absolute;top:-20px;left:0;right:0;text-align:center;color:var(--navy);font-size:13px}
.vel em{font-style:normal;font-size:11.5px;color:var(--fg2);margin-top:4px;text-align:center}
table.pm tr.lvl-e td{background:var(--mist)}table.pm tr.lvl-f td{background:var(--surface1)}table.pm tr.lvl-t td{font-size:13.5px;background:#fcfdfe}
.drill{font-size:13px;margin-left:8px;color:var(--blue)}
.g-tog{border:0;background:none;cursor:pointer;color:var(--navy);width:18px;padding:0;font-size:13px}
.gantt{background:#fff;border:1px solid var(--b1);border-radius:10px;overflow-x:auto;--lab:420px}
.gantt.wf{--lab:860px}
.g-row{display:grid;grid-template-columns:var(--lab) minmax(520px,1fr);border-bottom:1px solid var(--b1);min-height:34px;min-width:calc(var(--lab) + 520px)}
.g-head{position:sticky;top:0;background:var(--navy);color:#fff;z-index:2;min-height:48px}
.g-head .g-lab{font:700 11.5px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.g-lab{display:flex;align-items:center;gap:8px;padding:4px 10px;border-right:1px solid var(--b1);font-size:13.5px;min-width:0}
.g-name{flex:1;min-width:0;display:flex;align-items:center;gap:4px;padding-left:calc(var(--d,0)*18px);white-space:nowrap;overflow:hidden}
.g-title{overflow:hidden;text-overflow:ellipsis}.g-sp{width:18px;flex:none}
.g-type{font:700 10px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);width:58px;flex:none}
.g-wbs{width:52px;flex:none;color:var(--fg2);font-variant-numeric:tabular-nums}.g-col{width:72px;flex:none;font-size:12.5px;color:var(--charcoal)}.g-col.n{width:44px;text-align:right}.g-col.o{width:64px}.wf .g-col.p{width:84px}
main.wide{max-width:1500px}
.g-head .g-col,.g-head .g-wbs{color:#fff}
.lvl-Epic .g-lab{font-weight:700;background:var(--mist)}.lvl-Feature .g-lab{font-weight:700;background:var(--surface1)}.lvl-Story .g-lab{font-weight:600}
.noepic .g-title{color:var(--red)}
.g-track{position:relative}.g-head .g-track{display:flex;flex-direction:column}
.g-months,.g-sprints{position:relative;height:24px}.g-months span,.g-sprints span{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding-left:6px;border-left:1px solid rgba(255,255,255,.3);font-size:11.5px;overflow:hidden;white-space:nowrap}
.g-sprints span{background:rgba(255,255,255,.08)}.g-sprints span.cur{background:rgba(255,255,255,.28);font-weight:700}
.g-body{position:relative}.g-grid{position:absolute;inset:0 0 0 var(--lab);pointer-events:none}
.g-grid i{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(0,45,114,.07)}
.g-today{position:absolute;top:0;bottom:0;border-left:2px solid var(--red);z-index:1}
.g-bar{position:absolute;top:9px;height:16px;border-radius:4px;background:var(--green);overflow:hidden}
.g-bar i{display:block;height:100%;background:rgba(0,0,0,.25)}
.g-bar.lvl-Epic{background:#2a3f6e;height:12px;top:11px}.g-bar.lvl-Feature{background:var(--navy);height:14px;top:10px}.g-bar.lvl-Story{background:#4f7cc0}
.g-bar.go{background:var(--green)}.g-bar.new{background:#b8c3d1}.g-bar.risk{background:#E3A008}.g-bar.late{background:var(--red)}.g-bar.done{background:#7fb8a3}
.g-dia{position:absolute;top:6px;transform:translateX(-50%);color:var(--navy);font-size:14px;line-height:1;z-index:1}.g-dia.fixed{color:var(--red)}.g-dia.tgt{color:#4f7cc0}
.g-mslab{position:absolute;top:9px;font-size:11.5px;color:var(--fg2);white-space:nowrap}
.g-none{position:absolute;left:8px;top:8px;font-size:12px;color:var(--fg2);font-style:italic}
.g-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--fg2);margin:10px 0 0}.g-legend span{display:flex;align-items:center;gap:6px}
.g-legend .g-bar{position:static;width:22px;height:10px;display:inline-block}.g-today-k{display:inline-block;width:2px;height:14px;background:var(--red)}
.ws-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}.ws-t{font:800 22px 'Libre Franklin',sans-serif;color:var(--navy);margin:2px 0 4px}
.note{border-bottom:1px solid var(--b1);padding:10px 0}.note:last-child{border:0}
.deckbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.deckbar>div:first-child{flex:1 1 420px}
.deck-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.deck-nav button{border:1px solid var(--b2);background:#fff;border-radius:6px;padding:6px 12px;font:600 13px Barlow,sans-serif;color:var(--fg2);cursor:pointer}.deck-nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.slide{background:#fff;border:1px solid var(--b2);border-radius:10px;overflow:hidden;box-shadow:0 6px 24px rgba(0,45,114,.08)}
.slide-h{background:var(--navy);color:#fff;display:flex;justify-content:space-between;padding:14px 22px;font:700 18px 'Libre Franklin',sans-serif}.slide-h span:last-child{font:400 13px Barlow,sans-serif;opacity:.8;align-self:center}
.slide-b{padding:18px 22px;max-height:70vh;overflow:auto}.slide-b .gantt{--lab:360px}
.slide-f{display:flex;justify-content:space-between;align-items:center;padding:10px 22px;border-top:1px solid var(--b1)}

function capFor(name){if(!D.capacity)return null;const m=D.capacity.members.find(x=>x.name===name);if(!m)return {missing:true};
  const sp=sprint(D.capacity.sprint);const total=m.perDay*workdays(sp.start,sp.end,m.daysOff);const left=m.perDay*workdays(TODAY_ISO>sp.start?TODAY_ISO:sp.start,sp.end,m.daysOff);
  return {perDay:m.perDay,activity:m.activity,daysOff:m.daysOff.length,total,left}}

/* ---------- heads up (attention checks) ---------- */
function headsUp(person){const out=[],cs=cur(),mine=TASKS.map(taskNow).filter(t=>!person||t.owner===person);
  const add=(sev,text,ids)=>out.push({sev,text,ids:ids||[]});
  const late=mine.filter(isLate);if(late.length)add("red",`${late.length} task${late.length>1?"s are":" is"} past due and not done`,late.map(t=>t.id));
  const soon=mine.filter(t=>isOpen(t)&&t.due&&t.due>=TODAY_ISO&&t.due<=addDays(TODAY_ISO,2));if(soon.length)add("amber",`${soon.length} task${soon.length>1?"s are":" is"} due in the next 2 days`,soon.map(t=>t.id));
  mine.filter(t=>isOpen(t)&&dep(t.id).waits.length).forEach(t=>{const bad=dep(t.id).waits.map(id=>taskNow(TASKS.find(x=>x.id===id))).filter(p=>p&&isOpen(p)&&(isLate(p)||(t.due&&p.due&&p.due>t.due)||(t.due&&!p.due)));
    if(bad.length)add("red",`#${t.id} is waiting on ${bad.map(p=>"#"+p.id).join(", ")}, which ${bad.length>1?"aren't":"isn't"} on track to finish before it's needed`,[t.id])});
  if(person)TASKS.map(taskNow).filter(t=>isOpen(t)&&dep(t.id).waits.length).forEach(t=>dep(t.id).waits.forEach(id=>{const p=taskNow(TASKS.find(x=>x.id===id));if(p&&p.owner===person&&isOpen(p))add("amber",`#${t.id} (${t.owner||"unassigned"}) is waiting on your task #${p.id}${t.due?" and is due "+fmtS(t.due):""}`,[p.id])}));
  {const st=mine.filter(t=>isOpen(t)&&t.iter&&(t.iter===D.currentSprint||isLate(t))&&lastUpd(t)&&days(lastUpd(t).d,TODAY_ISO)>7);if(st.length)add(st.some(t=>days(lastUpd(t).d,TODAY_ISO)>14)?"amber":"info",`${st.length} open task${st.length>1?"s haven't":" hasn't"} been updated in over a week`,st.map(t=>t.id))}
  if(cs&&cs.end){const pulled=mine.filter(t=>t.iter===D.currentSprint&&t.state==="New"),left=workdays(TODAY_ISO,cs.end);
    if(pulled.length&&left<=8)add("amber",`${pulled.length} task${pulled.length>1?"s are":" is"} in ${D.currentSprint} but still New, with ${left} working days left. Start ${pulled.length>1?"them":"it"} or move ${pulled.length>1?"them":"it"} out`,pulled.map(t=>t.id));
    const after=mine.filter(t=>isOpen(t)&&t.iter&&t.due&&sprint(t.iter)&&sprint(t.iter).end&&t.due>sprint(t.iter).end);if(after.length)add("amber",`${after.length} task${after.length>1?"s have":" has"} a due date after ${after.length>1?"their":"its"} sprint ends`,after.map(t=>t.id));
    const nodue=mine.filter(t=>isOpen(t)&&t.iter===D.currentSprint&&!t.due);if(nodue.length)add("info",`${nodue.length} task${nodue.length>1?"s":""} in this sprint ${nodue.length>1?"have":"has"} no due date`,nodue.map(t=>t.id))}
  else if(D.sprints.every(s=>!s.start))add("info",`The sprints on this board have no start or end dates in ADO, so due-date and capacity checks can't run`,[]);
  const nodates=mine.filter(t=>isOpen(t)&&t.iter&&!t.due);if(!cs?.end&&nodates.length)add("info",`${nodates.length} task${nodates.length>1?"s":""} in ${D.currentSprint} ${nodates.length>1?"have":"has"} no due date`,nodates.map(t=>t.id));
  if(person&&D.capacity){const c=capFor(person),insp=mine.filter(t=>isOpen(t)&&t.iter===D.capacity.sprint);
    if(c.missing&&insp.length)add("amber",`You have ${insp.length} task${insp.length>1?"s":""} in ${D.capacity.sprint} but no capacity set for this sprint in ADO`,[]);
    else if(c&&!c.missing&&insp.length)add("info",`You have ${c.left}h of capacity left this sprint. Your tasks have no Remaining Work set, so ADO can't tell if they fit`,[])}
  if(!person){const un=TASKS.filter(t=>isOpen(t)&&t.iter&&!t.owner);if(un.length)add("amber",`${un.length} sprint task${un.length>1?"s have":" has"} no one assigned, so no one will be asked to update ${un.length>1?"them":"it"}`,un.map(t=>t.id));
    D.features.filter(f=>!f.epic).forEach(f=>add("info",`Feature #${f.id} isn't linked to an Epic in ADO`,[f.id]));
    if(D.velocity){const v=D.velocity.sprints.map(x=>x[1]);if(v.length>2&&v[v.length-1]<v.slice(0,-1).reduce((a,b)=>a+b,0)/(v.length-1)/2)add("amber",`Velocity is down: ${v[v.length-1]} stor${v[v.length-1]===1?"y":"ies"} closed last sprint against an average of ${(v.slice(0,-1).reduce((a,b)=>a+b,0)/(v.length-1)).toFixed(1)}`,[])}

function nodeHealth(n){const all=n.tasks,ov=store.get(K("rag:"+n.key)),cnt=all.filter(t=>t.state!=="Not Needed"),fn=f=>all.filter(f).length,why=[],amb=[];
  if(fn(t=>t.state==="Blocked"))why.push(fn(t=>t.state==="Blocked")+" blocked");if(fn(isLate))why.push(fn(isLate)+" overdue");
  if(n.target&&n.target<TODAY_ISO&&fn(isOpen))why.push("past target date");
  const esc_=allLead().filter(x=>leadOpen(x)&&x.type==="Escalation"&&nodeHas(n,x)).length;if(esc_)why.push(esc_+" escalation"+(esc_>1?"s":""));
  if(fn(t=>isOpen(t)&&t.health==="At risk"))amb.push(fn(t=>isOpen(t)&&t.health==="At risk")+" at risk");
  const cs=cur();if(cs&&cs.end&&workdays(TODAY_ISO,cs.end)<=8&&fn(t=>t.iter===D.currentSprint&&t.state==="New"))amb.push(fn(t=>t.iter===D.currentSprint&&t.state==="New")+" sprint tasks not started");
  if(fn(t=>isOpen(t)&&t.iter&&!t.owner))amb.push(fn(t=>isOpen(t)&&t.iter&&!t.owner)+" unassigned");
  const done=cnt.length&&!fn(isOpen);const calc=done?"Done":why.length?"Off track":amb.length?"At risk":"On track";
  return {calc,rag:(ov&&ov.rag)||calc,reason:ov&&ov.reason,override:!!ov,why:why.concat(amb),done:cnt.filter(t=>t.state==="Done").length,cnt:cnt.length}}

  document.querySelector("[data-addlead]").onchange=e=>{if(!e.target.value)return;store.set(K("leads:"+k),ls.concat([e.target.value]));renderSettings();refreshRole()};
  document.querySelectorAll("[data-share]").forEach(x=>x.onclick=()=>{store.set(K("share:"+k),!!x.dataset.share);renderSettings()})}
function refreshRole(){const r=role(),c=document.getElementById("rolechip"),av=document.getElementById("avatar");if(av){av.textContent=(me||"").split(/\s+/).map(w=>w[0]||"").join("").slice(0,2).toUpperCase();av.title=me||""}if(c){c.textContent=r;c.className="rolechip r-"+r.replace(/ /g,"");c.title=ROLE_TXT[r]}}
const TABS=[["my","My work"],["pm","Program view"],["tl","Timeline"],["raid","RAID log"],["deck","Status deck"]];
function render(){const r=role();const tabs=TABS.filter(([k])=>!(k==="my"&&r==="Viewer")).concat(r==="Admin"?[["set","⚙ Settings"]]:[]);
  if(!tabs.some(([k])=>k===tab))tab=tabs[0][0];refreshRole();
  document.getElementById("main").classList.toggle("wide",["tl","deck","pm"].includes(tab));document.getElementById("nav").innerHTML=tabs.map(([k,l])=>`<button class="${tab===k?"on":""}" data-tab="${k}">${l}${k!=="my"&&k!=="set"&&!canLead()?' <span class="lock" title="Read-only for you">👁</span>':""}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;openRow=null;render()});
  if(tab!=="my"&&tab!=="set"&&notShared()){document.getElementById("main").innerHTML=`<div class="panel empty">This program isn't shared with your account. Ask the project lead for access.</div>`;return}
  ({my:renderMy,pm:renderPM,tl:renderTimeline,raid:renderRaid,deck:renderDeck,set:renderSettings})[tab]();
  if(["pm","raid","deck","tl"].includes(tab)&&!canLead()){const m=document.getElementById("main");m.insertAdjacentHTML("afterbegin",roBanner())}}
function fillPickers(){const pj=document.getElementById("proj"),bd=document.getElementById("board"),us=document.getElementById("user");
  pj.innerHTML=ALL.projects.map((p,i)=>`<option value="${i}" ${i==projI?"selected":""}>${esc(p.name)}</option>`).join("");
  bd.innerHTML=ALL.projects[projI].boards.map((b,i)=>`<option value="${i}" ${i==boardI?"selected":""} ${b.data?"":"disabled"}>${esc(b.name)}${b.data?"":" (not in prototype)"}</option>`).join("");
  const ps=people();if(!ps.includes(me))me=ps.includes("Sam Rivera")?"Sam Rivera":ps[0];us.innerHTML=ps.map(o=>`<option ${o===me?"selected":""}>${esc(o)}</option>`).join("")}
document.getElementById("proj").onchange=e=>{projI=+e.target.value;boardI=0;store.set("proj",projI);loadBoard();store.set("board",boardI);fillPickers();pmWs=new Set();progKey=null;gCollapsed=new Set();render()};
document.getElementById("board").onchange=e=>{boardI=+e.target.value;store.set("board",boardI);loadBoard();fillPickers();pmWs=new Set();progKey=null;render()};
document.getElementById("user").onchange=e=>{me=e.target.value;store.set("me",me);myStoryOpen=null;flt={show:"todo",sprint:"current",feature:"all",story:"all"};render()};
loadBoard();fillPickers();if(["my","pm","tl","raid","deck"].includes((location.hash||"").slice(1)))tab=location.hash.slice(1);render();
</script>
